version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: mysql_pos
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_point_of_sales
      MYSQL_USER: user_pos
      MYSQL_PASSWORD: pass_pos
    ports:
      - '3306:3306'
    volumes:
      - ./mysql_data:/var/lib/mysql
